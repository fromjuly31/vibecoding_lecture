 if(!hosts.length)return;
 for(const host of hosts){
  on(host,'pointerenter',()=>host.classList.remove('tooltip-dismissed'));

 $('#demo').innerHTML=`<div class="dock-scene">${body[s.tab]}<nav class="floating-dock" aria-label="체험용 하단 메뉴">${tabs.map(([id,label,ic])=>`<button class="dock-button ${s.tab===id?'active':''}" data-dock="${id}" aria-label="${label}" aria-pressed="${s.tab===id}">${icon(ic,21)}<span class="tooltip-text">${label}</span></button>`).join('')}</nav></div>`+note('메뉴가 화면 위에 떠 있어요. 아이콘을 누르면 <b>실제 콘텐츠와 기능</b>이 열려요.');
 many('[data-dock]','click',e=>{s.tab=e.currentTarget.dataset.dock;mount()});on('#dock-attendance','click',()=>{s.attended=!s.attended;mount()});on('#dock-assignment','click',()=>{s.submitted=!s.submitted;mount()});on('#dock-alerts','change',e=>{s.alerts=e.target.checked;mount()});

demos.sidebar=s=>{

function dashboardStudents(classIndex){const d=classStats[classIndex],present=Math.round(d.count*d.attendance/100),submitted=Math.round(d.count*d.submission/100);const roster=['김하늘','이서준','박지우','최도윤','정서연','윤민준','강지호','신예린','한수빈','오지안','장현우','조은서','임시우','송다은','유건우','배지윤','백수현','문예준','남소율','차이안','권하준','서유나','안도현','전채원','양서우','홍민서','고준우','성지민','김태오','이하린'];return roster.slice(0,d.count).map((_,i)=>({id:i,name:roster[(i+classIndex*7)%roster.length],group:Math.floor(i/4)+1,present:i<present,submitted:i<submitted}));}
function chart(values){return `<svg class="bar-chart" viewBox="0 0 420 190" role="img" aria-label="월요일부터 금요일 출석률: ${values.join(', ')}퍼센트"><g fill="none" stroke="#edf0f3">${[28,70,112,154].map(y=>`<path d="M35 ${y}H410"/>`).join('')}</g><g fill="#a1a8b3" font-family="sans-serif" font-size="9"><text x="3" y="31">100</text><text x="10" y="73">66</text><text x="10" y="115">33</text><text x="17" y="157">0</text></g>${values.map((v,i)=>`<rect x="${59+i*72}" y="${154-v*1.26}" width="34" height="${v*1.26}" rx="5" fill="${i===4?'#ed8a50':'#f3ccb2'}"/><text x="${76+i*72}" y="${147-v*1.26}" text-anchor="middle" fill="#947154" font-family="sans-serif" font-size="9">${v}%</text><text x="${76+i*72}" y="177" text-anchor="middle" fill="#929aa7" font-size="10">${['월','화','수','목','금'][i]}</text>`).join('')}</svg>`}
demos.dashboard=s=>{
 s.class??=0;s.tab??='summary';const d=classStats[s.class],roster=dashboardStudents(s.class),present=roster.filter(p=>p.present).length,submitted=roster.filter(p=>p.submitted).length;const tabs=[['summary','요약','grid'],['students','학생','users'],['attendance','출석','calendar'],['assignments','과제','file']];
 const table=kind=>{const label=kind==='students'?'학생 명단':kind==='attendance'?'학생별 출석 현황':'학생별 과제 제출 현황';return `<div class="dashboard-table-wrap" tabindex="0" role="region" aria-label="${label}, 아래로 스크롤해 모든 학생 확인"><table class="dashboard-table"><caption class="sr-only">1학년 ${s.class+1}반 ${label}</caption><thead><tr><th scope="col">번호</th><th scope="col">학생 이름</th><th scope="col">${kind==='students'?'모둠':kind==='attendance'?'출결':'제출 상태'}</th></tr></thead><tbody>${roster.map(p=>`<tr data-dashboard-student="${p.id}"><td>${String(p.id+1).padStart(2,'0')}</td><td><span class="row">${avatar(p.name,p.id)}<span>${p.name}</span></span></td><td>${kind==='students'?`<span class="chip gray">${p.group}모둠</span>`:kind==='attendance'?`<span class="chip ${p.present?'':'orange'}">${p.present?'출석':'결석'}</span>`:`<span class="chip ${p.submitted?'':'orange'}">${p.submitted?'제출':'미제출'}</span>`}</td></tr>`).join('')}</tbody></table></div>`};
 const chartPanel=`<div class="mini-card chart-card"><div class="row between"><h4>이번 주 출석률</h4><span class="small muted">1학년 ${s.class+1}반</span></div>${chart(d.bars)}</div>`;
 const absent=roster.filter(p=>!p.present),unsubmitted=roster.filter(p=>!p.submitted),groups=[...new Set(roster.map(p=>p.group))];
 const overviewLink=(tab,label)=>`<button class="overview-link" data-dashboard-go="${tab}" aria-label="${label}" aria-controls="dashboard-panel">보기${icon('right',12)}</button>`;
 const groupSizes=groups.map(group=>roster.filter(p=>p.group===group).length),smallestGroup=Math.min(...groupSizes),largestGroup=Math.max(...groupSizes);
 const groupCaption=smallestGroup===largestGroup?`모둠당 ${smallestGroup}명`:`모둠당 ${smallestGroup}~${largestGroup}명`;
 const namePreview=(people,empty)=>people.length?people.slice(0,2).map(p=>p.name).join(' · ')+(people.length>2?' 외 '+(people.length-2)+'명':''):empty;
 const summaryPanel=`<div class="dashboard-overview"><section class="overview-widget overview-attendance" aria-labelledby="overview-attendance-title"><div class="overview-widget-head"><h4 id="overview-attendance-title">주간 출석</h4>${overviewLink('attendance','출석 현황 상세 보기')}</div><p class="overview-average">이번 주 평균<b>${Math.round(d.bars.reduce((a,b)=>a+b,0)/d.bars.length)}%</b></p><div class="overview-bars" role="img" aria-label="월요일부터 금요일 출석률: ${d.bars.join(', ')}퍼센트">${d.bars.map((value,i)=>`<div class="overview-day"><span>${value}%</span><div class="overview-bar-track"><i style="height:${value}%"></i></div><small>${['월','화','수','목','금'][i]}</small></div>`).join('')}</div></section><section class="overview-widget overview-assignment" aria-labelledby="overview-assignment-title"><div class="overview-widget-head"><h4 id="overview-assignment-title">과제 진행률</h4>${overviewLink('assignments','과제 제출 현황 상세 보기')}</div><p class="overview-task-name">독서 감상문</p><div class="overview-task-body"><div class="overview-donut" id="overview-assignment-progress" style="--completion:${submitted/d.count*100}%" role="progressbar" aria-label="독서 감상문 제출" aria-valuemin="0" aria-valuemax="${d.count}" aria-valuenow="${submitted}" aria-valuetext="${d.submission}% 제출"><strong>${d.submission}<small>%</small></strong></div><div class="overview-task-legend"><div><i></i>제출<b id="overview-submitted-count">${submitted}명</b></div><div><i></i>미제출<b id="overview-unsubmitted-count">${unsubmitted.length}명</b></div></div></div><p class="overview-task-footer">전체 ${d.count}명 기준</p></section><section class="overview-widget overview-students" aria-labelledby="overview-students-title"><div class="overview-widget-head"><h4 id="overview-students-title">우리반 구성</h4>${overviewLink('students','학생 명단 상세 보기')}</div><div class="overview-class-body"><div class="overview-avatar-stack" aria-hidden="true">${roster.slice(0,3).map(p=>avatar(p.name,p.id)).join('')}</div><div><p class="overview-group-value" id="overview-group-count">${groups.length}개 모둠</p><p class="overview-group-caption">${groupCaption}</p></div></div></section><section class="overview-widget" aria-labelledby="overview-review-title"><div class="overview-widget-head"><h4 id="overview-review-title">확인할 사항</h4>${icon('info',13)}</div><div class="overview-review"><button data-dashboard-go="attendance" aria-label="결석 ${absent.length}명, ${esc(absent.map(p=>p.name).join(', ')||'모두 출석')}. 출석 상세 보기"><span class="overview-review-label">결석<b id="overview-absent-count" class="${absent.length?'':'clear'}">${absent.length}명</b></span><span class="overview-review-names" id="overview-absent-students" title="${esc(absent.map(p=>p.name).join(', ')||'모두 출석')}">${esc(namePreview(absent,'모두 출석'))}</span>${icon('right',12)}</button><button data-dashboard-go="assignments" aria-label="과제 미제출 ${unsubmitted.length}명, ${esc(unsubmitted.map(p=>p.name).join(', ')||'모두 제출')}. 과제 상세 보기"><span class="overview-review-label">미제출<b class="${unsubmitted.length?'':'clear'}">${unsubmitted.length}명</b></span><span class="overview-review-names" id="overview-pending-students" title="${esc(unsubmitted.map(p=>p.name).join(', ')||'모두 제출')}">${esc(namePreview(unsubmitted,'모두 제출'))}</span>${icon('right',12)}</button></div></section></div>`;
 const panels={summary:summaryPanel,students:`<div class="dashboard-panel-head"><div><h4>우리반 학생 명단</h4><p>1학년 ${s.class+1}반 · ${d.count}명의 친구들</p></div><span class="chip gray">${Math.ceil(d.count/4)}개 모둠</span></div>${table('students')}`,attendance:`<div class="dashboard-panel-head"><div><h4>오늘의 출석 현황</h4><p>1학년 ${s.class+1}반 · 학생별 출결 확인</p></div><span class="chip">출석률 ${d.attendance}%</span></div><div class="dashboard-stats"><span class="chip">출석 ${present}명</span><span class="chip orange">결석 ${d.count-present}명</span></div>${table('attendance')}<div style="margin-top:16px">${chartPanel}</div>`,assignments:`<div class="dashboard-panel-head"><div><h4>독서 감상문 제출 현황</h4><p>1학년 ${s.class+1}반 · 이번 주 학급 과제</p></div><span class="chip orange">${d.submission}%</span></div><div class="dashboard-stats"><span class="chip">제출 ${submitted}명</span><span class="chip orange">미제출 ${d.count-submitted}명</span><span class="chip gray">전체 ${d.count}명</span></div><progress class="assignment-progress" value="${submitted}" max="${d.count}" aria-label="독서 감상문 제출 ${d.count}명 중 ${submitted}명">${d.submission}%</progress>${table('assignments')}`};
 $('#demo').innerHTML=toolbar('우리반 한눈에 보기','요약부터 학생별 현황까지 탭으로 살펴보세요.',`<label class="sr-only" for="dashboard-class">통계를 볼 학급</label><select id="dashboard-class" style="font-size:11px">${classStats.map((_,i)=>`<option value="${i}" ${s.class===i?'selected':''}>1학년 ${i+1}반</option>`).join('')}</select>`)+`<div class="kpi-grid">${[['students','전체 학생',d.count,'명','학생 명단 보기'],['attendance','오늘 출석률',d.attendance,'%','출석 '+present+'명 · 결석 '+(d.count-present)+'명'],['assignments','과제 제출률',d.submission,'%','제출 '+submitted+'명 · 미제출 '+(d.count-submitted)+'명']].map(([target,label,value,unit,foot])=>`<button class="kpi dashboard-kpi ${s.tab===target?'active':''}" data-dashboard-go="${target}" aria-controls="dashboard-panel" aria-label="${label} ${value}${unit}, ${tabs.find(t=>t[0]===target)[1]} 탭 보기"><span class="kpi-label">${label}${icon('right',11)}</span><p class="kpi-value">${value}<small>${unit}</small></p><p class="kpi-foot">${foot}</p></button>`).join('')}</div><div class="tabs dashboard-tabs" role="tablist" aria-label="대시보드 정보 선택">${tabs.map(([id,label,ic])=>`<button id="dashboard-tab-${id}" role="tab" data-dashboard-tab="${id}" aria-controls="dashboard-panel" aria-selected="${s.tab===id}" tabindex="${s.tab===id?0:-1}">${icon(ic,15)}${label}</button>`).join('')}</div><div class="dashboard-panel" id="dashboard-panel" role="tabpanel" aria-labelledby="dashboard-tab-${s.tab}" tabindex="0">${panels[s.tab]}</div>`;
 const choose=id=>{s.tab=id;mount();$('#dashboard-tab-'+id).focus({preventScroll:true})};many('[data-dashboard-tab]','click',e=>choose(e.currentTarget.dataset.dashboardTab));many('[data-dashboard-go]','click',e=>choose(e.currentTarget.dataset.dashboardGo));many('[data-dashboard-tab]','keydown',e=>{const i=tabs.findIndex(t=>t[0]===s.tab);let next;if(e.key==='ArrowRight')next=(i+1)%tabs.length;if(e.key==='ArrowLeft')next=(i+tabs.length-1)%tabs.length;if(e.key==='Home')next=0;if(e.key==='End')next=tabs.length-1;if(next!==undefined){e.preventDefault();choose(tabs[next][0])}});on('#dashboard-class','change',e=>{s.class=Number(e.target.value);mount();$('#dashboard-class').focus({preventScroll:true})});
};

const ComboUI=(()=>{
 const instances=new Set();let dismissedAt=-Infinity;
 const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const chevron='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7 5 5 5-5"/></svg>';
 const check='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 4 4 8-8"/></svg>';
 function render(id,label,value){return '<div class="custom-combo"><button type="button" class="combo-trigger" id="'+escape(id)+'" role="combobox" aria-label="'+escape(label)+'" aria-haspopup="listbox" aria-expanded="false" aria-controls="'+escape(id)+'-options"><span class="combo-value">'+escape(value)+'</span>'+chevron+'</button></div>';}
 function mount(trigger,items,value,onChange,settings={}){
  const controller=new AbortController(),signal=controller.signal;
  let options=items,selected=value,active=0,buffer='',typedAt=0,destroyed=false;
  const menu=document.createElement('div');menu.id=trigger.id+'-options';menu.className='combo-menu';menu.role='listbox';menu.setAttribute('aria-label',trigger.getAttribute('aria-label'));menu.hidden=true;document.body.append(menu);
  const listen=(node,type,fn,extra={})=>node.addEventListener(type,fn,{signal,...extra});
  const index=()=>Math.max(0,options.findIndex(option=>String(option.value)===String(selected)));
  function renderOptions(){
   menu.innerHTML=options.map((option,i)=>'<div class="combo-option" role="option" id="'+menu.id+'-'+i+'" data-option="'+i+'" aria-selected="'+(i===index())+'"><span class="combo-option-text"><span>'+escape(option.label)+'</span>'+(option.detail?'<small>'+escape(option.detail)+'</small>':'')+'</span><span class="combo-check">'+check+'</span></div>').join('');
   trigger.querySelector('.combo-value').textContent=options[index()]?.label||'';
  }
  function place(){
   if(menu.hidden)return;const r=trigger.getBoundingClientRect(),margin=12,width=Math.min(Math.max(r.width,184),innerWidth-margin*2),desired=Math.min(270,menu.scrollHeight);
   const below=innerHeight-r.bottom-margin-7,above=r.top-margin-7,up=below<desired&&above>below,space=Math.max(60,up?above:below);
   menu.style.width=width+'px';menu.style.maxHeight=Math.min(270,space)+'px';
   menu.style.left=Math.max(margin,Math.min(r.left,innerWidth-width-margin))+'px';
   menu.style.top=Math.max(margin,up?r.top-menu.offsetHeight-7:r.bottom+7)+'px';menu.dataset.side=up?'up':'down';
  }
  function mark(scroll=true){
   [...menu.children].forEach((el,i)=>el.classList.toggle('is-active',i===active));
   if(!menu.hidden){trigger.setAttribute('aria-activedescendant',menu.id+'-'+active);if(scroll)menu.children[active]?.scrollIntoView({block:'nearest'});}
  }

   active=index();renderOptions();menu.hidden=false;trigger.setAttribute('aria-expanded','true');place();mark();
   if(!matchMedia('(prefers-reduced-motion: reduce)').matches)menu.animate([{opacity:0,transform:'translateY('+(menu.dataset.side==='up'?4:-4)+'px)'},{opacity:1,transform:'none'}],{duration:160,easing:'ease-out'});
  }
  function choose(i){const option=options[i];if(!option)return;selected=option.value;renderOptions();close(true);onChange(selected);}
  listen(trigger,'click',event=>{event.stopPropagation();menu.hidden?open():close();});
  listen(trigger,'keydown',event=>{
   const key=event.key;
   if(['ArrowLeft','ArrowRight'].includes(key)){event.stopPropagation();return;}
   if(key==='Tab'){close();return;}
   if(key==='Escape'){if(!menu.hidden){event.preventDefault();event.stopPropagation();close(true);}return;}
   if(['ArrowDown','ArrowUp','Home','End','Enter',' '].includes(key)){
    event.preventDefault();event.stopPropagation();

   }

})();
